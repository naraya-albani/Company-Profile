<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 (CDN). Untuk produksi, pindahkan isi <style> di bawah ke input.css dan build dengan Tailwind CLI. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-utama: #1d4ed8;
        --color-utama-gelap: #1e3a8a;
        --color-aksen: #f59e0b;
        --color-teks: #1f2937;
        --color-teks-lembut: #64748b;
        --color-abu: #f1f5f9;
        --color-garis: #e2e8f0;

        --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
        --radius-kartu: 14px;
        --shadow-kartu: 0 10px 30px -12px rgb(15 23 42 / 0.18);
        --container-wadah: 1120px;

        /* Sama dengan CSS lama: tampilan HP sampai 800px, desktop mulai 801px */
        --breakpoint-md: 50.0625rem;
      }

      @layer base {
        h1,
        h2,
        h3 {
          @apply mb-3 font-bold leading-tight;
        }
        :focus-visible {
          @apply outline-3 outline-offset-2 outline-aksen;
        }
      }

      @layer components {
        .berhasil {
          @apply font-semibold text-green-700;
        }
        .gagal {
          @apply font-semibold text-red-700;
        }
      }
    </style>
  </head>
  <body>
    <header
      class="navbar sticky top-0 z-50 border-b border-garis bg-white/90 backdrop-blur-[8px]"
    >
      <div
        class="mx-auto flex h-[70px] max-w-wadah items-center justify-between px-6"
      >
        <a
          href="/"
          class="inline-flex items-center gap-[0.6rem] font-extrabold text-teks"
          >PT Contoh Jaya</a
        >
        <span>Admin</span>
      </div>
    </header>

    <main>
      <section class="mx-auto max-w-[900px] px-6 py-8">
        <h1>Login</h1>

        <form
          id="form-auth"
          data-mode="login"
          class="flex max-w-[500px] flex-col gap-[0.4rem]"
        >
          <label for="email" class="text-[0.95rem] font-semibold">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="100"
            class="mb-[0.6rem] rounded-[10px] border border-slate-300 px-[0.9rem] py-[0.7rem] focus:border-utama focus:outline-3 focus:outline-blue-200"
          />

          <label for="password" class="text-[0.95rem] font-semibold"
            >Password</label
          >
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="mb-[0.6rem] rounded-[10px] border border-slate-300 px-[0.9rem] py-[0.7rem] focus:border-utama focus:outline-3 focus:outline-blue-200"
          />

          <p id="status-form" role="status" aria-live="polite"></p>

          <button
            type="submit"
            id="tombol-kirim"
            class="inline-block cursor-pointer self-start rounded-full border-2 border-utama bg-utama px-6 py-3 font-semibold text-white transition duration-150 hover:-translate-y-0.5 hover:border-utama-gelap hover:bg-utama-gelap disabled:translate-y-0 disabled:cursor-wait disabled:opacity-60"
          >
            Login
          </button>
          <p class="mt-2 text-teks-lembut">
            Belum punya akun?
            <a
              href="/register.html"
              class="font-semibold text-utama hover:underline"
              >Register</a
            >
          </p>
        </form>
      </section>
    </main>

    <script src="/auth.js"></script>
  </body>
</html>
